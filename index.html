<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lara Lopes | Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: white;
      color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      text-align: center;
      width: 100%; /* Make sure it takes full width */
    }

    .greeting {
      font-size: 2.5rem;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      flex-direction: column; /* Stack the buttons vertically */
      align-items: center;
      gap: 15px; /* Space between buttons */
    }

    .cta {
      font-size: 2rem;
      color: black;
      text-decoration: none;
      border: 2px solid black;
      padding: 8px 30px;
      border-radius: 30px;
      transition: background-color 0.3s ease;
      display: inline-block;
    }

    .cta:hover {
      background-color: black;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="greeting">Hi there! Welcome to my portfolio.</p>
    <div class="buttons">
      <a href="Portfolio_LaraLopes_2025.pdf" class="cta" target="_blank">Portfolio - 2025</a>
      <a href="CV_Lara Lopes.pdf" class="cta" target="_blank">Curriculum Vitae</a>
    </div>
  </div>
</body>
</html>
