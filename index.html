<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lara Lopes | UX/UI Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: white;
      color: black;
      display: flex;
      flex-direction: column;
      text-align: center;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .greeting {
      font-size: 1.5rem;
      margin-bottom: 30px;
    }

    .buttons {
  display: flex;
  flex-direction: column;
  gap: 15px;
  align-items: center;
}

.cta {
  font-size: 1.2rem;
  padding: 8px 30px;
  border-radius: 999px;
  transition: background-color 0.3s ease, color 0.3s ease;
  display: inline-block;
  text-decoration: none;
}

/* Primary: Portfolio */
.cta.primary {
  background-color: #ccc;
  color: black;
  border: 2px solid transparent;
}

.cta.primary:hover {
  background-color: black;
  color: white;
}

/* Secondary: CV */
.cta.secondary {
  background-color: white;
  color: black;
  border: 2px solid black;
}

.cta.secondary:hover {
  background-color: black;
  color: white;
}

    footer {
      font-size: 0.8rem;
      color: #555;
      padding: 20px;
    }
   
    
  </style>
</head>
<body>
  <div class="container">
    <p class="greeting">Hi! Welcome to my portfolio :) </p>
    <div class="buttons">
      <a href="Portfolio_LaraLopes_2025.pdf" class="cta primary" target="_blank">UX/UI Portfolio</a>
      <a href="CV_LaraLopes.pdf" class="cta secondary" target="_blank">View my CV</a>
    </div>
  </div>
  <footer>
    Lara Lopes – 2025
  </footer>
</body>
</html>
